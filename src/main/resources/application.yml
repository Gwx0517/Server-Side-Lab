spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lab_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  application:
    name: hello-server

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-prefix: sys_
